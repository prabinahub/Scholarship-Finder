{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 460px;">
  <div class="card-body">
    <h4 class="mb-3">Create student account</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input class="form-control" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password (at least 6 characters)</label>
        <input class="form-control" type="password" name="password" minlength="6" required>
      </div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="small text-center mt-3 mb-0">Already registered? <a href="/login">Login</a></p>
  </div>
</div>
{% endblock %}
